appId: com.hangwu.desktop
productName: Hang Wonder Union
directories:
  output: release
  buildResources: build
files:
  - out/**
  - package.json
# sql.js là WASM thuần (không native) → đọc file .wasm + migrations lúc runtime
# từ resourcesPath (xem electron/db/connection.ts, migrate.ts).
extraResources:
  - from: migrations
    to: migrations
  - from: node_modules/sql.js/dist/sql-wasm.wasm
    to: sql-wasm.wasm
  - from: public/clover.png
    to: clover.png
win:
  target:
    - nsis
  icon: public/clover.png
  # App nội bộ offline → KHÔNG code-sign (không có chứng chỉ). Việc bỏ qua ký
  # được điều khiển bằng env CSC_IDENTITY_AUTO_DISCOVERY=false lúc build, nên
  # electron-builder KHÔNG tải/giải nén winCodeSign (gói chứa symlink macOS,
  # giải nén trên Windows cần quyền tạo symlink). Vẫn cho phép sửa exe (rcedit)
  # để nhúng icon — bước này không cần winCodeSign.
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  deleteAppDataOnUninstall: false
linux:
  target:
    - AppImage
    - deb
  icon: public/clover.png
  category: Office
deb:
  depends:
    - libgtk-3-0
    - libnotify4
    - libnss3
    - libxss1
    - libxtst6
    - xdg-utils
    - libatspi2.0-0
    - libuuid1
